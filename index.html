<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0057b7">
  <title>ШІ в навчанні — опитування</title>
  <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>
  <header class="topbar">
    <div class="topbar__title">ШІ в навчальному процесі</div>
    <div class="timer" id="timer" hidden>
      <span class="timer__icon" aria-hidden="true">⏱</span>
      <span id="timer-value">05:00</span>
    </div>
  </header>

  <main class="container">
    <section id="screen-start" class="card" hidden>
      <h1>Опитування</h1>
      <p class="muted"><span id="question-count">5 питань</span> з варіантами відповідей. На проходження є <b id="duration-label">5 хв</b>. Таймер стартує після введення імені.</p>
      <form id="start-form" novalidate>
        <label for="name" class="label">Ваше ім'я та прізвище</label>
        <input id="name" class="input" type="text" autocomplete="name" maxlength="60" placeholder="Напр., Олена Коваленко" required>
        <p id="start-error" class="error" hidden></p>
        <button id="start-btn" class="btn btn--primary" type="submit" disabled>Почати</button>
      </form>
    </section>

    <section id="screen-quiz" class="card" hidden>
      <div class="progress">
        <div class="progress__text" id="progress-text">Питання 1 з 5</div>
        <div class="progress__bar"><div class="progress__fill" id="progress-fill"></div></div>
      </div>
      <h2 id="question-text" class="question"></h2>
      <div id="options" class="options" role="radiogroup"></div>
      <button id="next-btn" class="btn btn--primary" type="button" disabled>Відповісти</button>
    </section>

    <section id="screen-result" class="card" hidden>
      <h1 id="result-title">Дякуємо!</h1>
      <div class="score">
        <div class="score__value" id="result-score">0 / 5</div>
        <div class="muted" id="result-meta"></div>
      </div>
      <ol id="result-list" class="review"></ol>
    </section>

    <p id="sync-status" class="sync" hidden></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.75.0/dist/umd/supabase.min.js"></script>
  <script src="js/config.js?v=3"></script>
  <script src="js/questions.js?v=3"></script>
  <script src="js/quiz.js?v=3"></script>
</body>
</html>
